name: gummi-agent
title: Gummi
summary: Terminal-first CLI/TUI for code review and issue workflows
description: |
  Gummi is a terminal-first CLI/TUI for code review and issue workflows.
  This snap packages the gummi single-binary built from ./cmd/gummi.
base: core24
confinement: strict
license: MIT
adopt-info: metadata
apps:
  gummi:
    command: bin/gummi

parts:
  metadata:
    plugin: nil
    source: .
    source-type: git
    override-build: |
      craftctl set version="$(cd "$CRAFT_PART_SRC" && sh scripts/snap-version.sh)"

  gummi:
    plugin: dump
    source: .
    source-type: git
    build-snaps:
      - go/1.26/stable
    override-build: |
      version="$(cd "$CRAFT_PART_SRC" && sh scripts/snap-version.sh)"
      go build -ldflags "-X main.Version=$version" -o "$CRAFT_PART_INSTALL"/bin/gummi ./cmd/gummi
    prime:
      - bin/gummi
