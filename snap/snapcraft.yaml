name: gummi-agent
title: Gummi
summary: Terminal-first CLI/TUI for code review and issue workflows
description: |
  Gummi is a terminal-first CLI/TUI for code review and issue workflows.
  This snap packages the gummi single-binary built from ./cmd/gummi.
base: core24
confinement: strict
license: MIT
adopt-info: metadata
apps:
  gummi:
    command: bin/gummi
  install-script:
    command: bin/install-script

parts:
  metadata:
    plugin: nil
    source: .
    source-type: git
    override-build: |
      craftctl set version="$(cd "$CRAFT_PART_SRC" && sh scripts/snap-version.sh)"

  gummi:
    plugin: dump
    source: .
    source-type: git
    build-snaps:
      - go/1.26/stable
    override-build: |
      version="$(cd "$CRAFT_PART_SRC" && sh scripts/snap-version.sh)"
      go build -ldflags "-X main.Version=$version" -o "$CRAFT_PART_INSTALL"/bin/gummi ./cmd/gummi
      install -D -m 0755 scripts/snap-install-script.sh "$CRAFT_PART_INSTALL"/bin/install-script
      install -D -m 0644 scripts/gummi-web-install.sh "$CRAFT_PART_INSTALL"/share/gummi-web-install.sh
    prime:
      - bin/gummi
      - bin/install-script
      - share/gummi-web-install.sh
