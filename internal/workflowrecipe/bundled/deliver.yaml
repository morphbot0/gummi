name: deliver
description: Design, build and validate a spec's done-when items
inputs: {}                # name: hint, filled at workflow_run
steps:
  - id: design
    role: contractor
    prompt: |
      Write the design for the spec below into {{artifacts.design}}.
      Do not edit code. Read the code first, and name in the design every
      place the change must reach (a sibling function, another case of the
      same type, another caller) and the behaviour around it that must keep
      working: the existing tests that cover it, what its callers expect,
      what its comments, docs and defaults promise.

      {{spec}}
    artifacts: { design: design.md }
  - id: build
    repeat:
      max: 3
      until: { verdict: APPROVED, in: review }
      onMax: pause
      steps:
        - id: implement
          role: implementer
          prompt: |
            Implement {{artifacts.design}} for the spec below. If
            {{artifacts.review}} exists, address its findings first. Run
            the whole test suite of every package you changed, and keep
            it passing.

            {{spec}}
        - id: reviews
          parallel:
            join: allSettled
            steps:
              # two reviews on two models: review-b reads the profile's
              # reviewer-alt slot, its reviewer when the profile has none
              - { id: review-a, role: reviewer,                     prompt: "Review {{run.diff}} against the spec and {{artifacts.design}}. List findings, including any place the change misses and any behaviour it breaks that worked before.\n\n{{spec}}" }
              - { id: review-b, role: reviewer, slot: reviewer-alt, prompt: "Review {{run.diff}} against the spec and {{artifacts.design}}. List findings, including any place the change misses and any behaviour it breaks that worked before.\n\n{{spec}}" }
        - id: verdict
          role: reviewer
          prompt: |
            Merge these reviews into {{artifacts.review}} as JSON:
            {"verdict": "APPROVED" | "CHANGES", "findings": [...]}.
            {{review-a.output}}
            {{review-b.output}}
          artifacts: { review: review.json }
  - id: validate
    role: reviewer
    prompt: |
      Read {{run.diff}} against the spec's done-when items. End with one
      line per item: MET: DW-n or UNMET: DW-n <why>.

      {{spec}}
